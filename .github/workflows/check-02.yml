name: Check SENZPSN 0.2
on:
  push:
    branches: [codex/senzpsn-windows-build]
    paths: [.github/workflows/check-02.yml]
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: SENZPSN-Windows-EXE
          run-id: 44283327402
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'SENZPSN'
          $setup = Get-Item SENZPSN-Setup-0.2.0-preview.exe
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dest`"" -PassThru -Wait
          if ($p.ExitCode) { throw 'Install failed' }
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES='1'
          $app = Join-Path $dest 'SENZPSN.exe'
          $p = Start-Process $app -ArgumentList '--help' -Wait -PassThru
          if ($p.ExitCode) { throw 'Executable failed' }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-mesa
      - shell: msys2 {0}
        run: |
          pacman -Ql mingw-w64-x86_64-mesa | grep -i 'opengl32.dll'
          gl=$(find /mingw64 -iname opengl32.dll | head -1)
          cp "$gl" "$(cygpath -u "$RUNNER_TEMP")/SENZPSN/opengl32sw.dll"
          cygpath -w /mingw64/bin >> "$GITHUB_PATH"
      - shell: pwsh
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'SENZPSN/SENZPSN.exe'
          $env:QT_OPENGL='software'
          $env:QT_FORCE_STDERR_LOGGING='1'
          $p = Start-Process $app -ArgumentList '--opengl' -PassThru -RedirectStandardError errors.txt
          Start-Sleep 15
          $p.Refresh()
          Get-Content errors.txt -Tail 40
          if ($p.HasExited -or !$p.MainWindowHandle) { throw 'Application window unavailable' }
          Write-Output "Opened $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id
